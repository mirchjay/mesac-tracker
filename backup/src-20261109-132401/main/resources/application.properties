spring.application.name=mesac-tracker
server.port=8080

# Local H2 database saved to ./data/mesac-admin.mv.db
# (New file name on purpose: the old ./data/mesacdb file has the old table layout.)
spring.datasource.url=jdbc:h2:file:./data/mesac-admin
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# H2 database browser: http://localhost:8080/h2-console  (JDBC URL: jdbc:h2:file:./data/mesac-admin)
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# Create/update tables from the @Entity classes
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.open-in-view=true

# Dates go to the browser as ISO text (2026-11-05T14:30:00)
spring.jackson.serialization.write-dates-as-timestamps=false

# Live update stream stays open
spring.mvc.async.request-timeout=-1

# Pick up HTML/CSS/JS edits without restarting
spring.thymeleaf.cache=false
spring.web.resources.cache.period=0