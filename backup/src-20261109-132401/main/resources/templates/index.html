<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MESAC Tracker</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/admin.css}" href="/css/admin.css">
    <link rel="icon" type="image/svg+xml" th:href="@{/favicon.svg}" href="/favicon.svg">
</head>
<body>

<header class="top">
    <a class="brand" href="#/day">MESAC</a>
    <nav class="nav" id="nav" aria-label="Main">
        <a href="#/day" data-view="day">Day</a>
        <a href="#/schedule" data-view="schedule">Schedule</a>
        <a href="#/standings" data-view="standings">Standings</a>
        <a href="#/teams" data-view="teams">Teams</a>
        <a href="#/records" data-view="records">Records</a>
    </nav>
    <div class="top-right">
        <div class="role" id="role" role="group" aria-label="View">
            <button type="button" data-action="role" data-v="ADMIN">Admin</button>
            <button type="button" data-action="role" data-v="USER">User</button>
        </div>
        <a class="icon-btn" href="/display" target="_blank" rel="noopener" title="Open the big screen" aria-label="Open the big screen">
            <svg width="18" height="18" viewBox="0 0 18 18" aria-hidden="true"><rect x="1.5" y="2.5" width="15" height="10" rx="1.5" fill="none" stroke="currentColor" stroke-width="1.6"/><path d="M6 15.5h6M9 12.5v3" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/></svg>
        </a>
        <span class="conn" id="conn" role="status" aria-label="Connecting"></span>
    </div>
</header>

<!-- Each page (Day, Schedule...) is drawn in here by admin.js -->
<main class="view" id="view" tabindex="-1">
    <p class="muted" style="padding:40px 0">Loading the tournament…</p>
</main>

<!-- Scoring panel for the selected match -->
<aside class="dock" id="dock" aria-label="Selected match" hidden></aside>

<!-- Slide-in form panel -->
<div class="backdrop" id="drawerBackdrop" hidden></div>
<aside class="drawer" id="drawer" role="dialog" aria-modal="true" hidden></aside>

<!-- Small dialogs: confirm, set score, shortcuts -->
<div class="backdrop center" id="modal" hidden></div>

<div class="toasts" id="toasts" aria-live="polite"></div>

<script th:src="@{/js/admin.js}" src="/js/admin.js"></script>
</body>
</html>
