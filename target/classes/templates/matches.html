<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>MESAC Live Matches & Scores</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 30px;
            background-color: #f4f6f8;
            color: #333;
        }
        .container {
            max-width: 900px;
            margin: 0 auto;
        }
        h1, h2 {
            color: #1a365d;
        }
        .card {
            background: #fff;
            padding: 20px;
            margin-bottom: 25px;
            border-radius: 8px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
        }
        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 15px;
        }
        th, td {
            text-align: left;
            padding: 12px;
            border-bottom: 1px solid #e2e8f0;
        }
        th {
            background-color: #2b6cb0;
            color: white;
        }
        tr:hover {
            background-color: #f7fafc;
        }
        .form-group {
            margin-bottom: 15px;
        }
        label {
            display: block;
            margin-bottom: 5px;
            font-weight: bold;
        }
        input[type="text"], input[type="number"], select {
            width: 100%;
            padding: 8px;
            box-sizing: border-box;
            border: 1px solid #cbd5e0;
            border-radius: 4px;
        }
        .btn {
            padding: 10px 20px;
            background-color: #2b6cb0;
            color: white;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            font-weight: bold;
        }
        .btn:hover {
            background-color: #2c5282;
        }
        .badge {
            padding: 4px 8px;
            border-radius: 4px;
            font-size: 0.85em;
            font-weight: bold;
            color: white;
        }
        .badge-live {
            background-color: #e53e3e;
        }
        .badge-done {
            background-color: #718096;
        }
        .badge-upcoming {
            background-color: #dd6b20;
        }
        .back-link {
            display: inline-block;
            margin-bottom: 15px;
            color: #2b6cb0;
            text-decoration: none;
            font-weight: bold;
        }
    </style>
</head>
<body>

<div class="container">
    <a href="/" class="back-link">&larr; Back to Home</a>
    <h1>MESAC Matches & Live Scores</h1>

    <!-- Create Match Form (Admin / Coach Portal) -->
    <div class="card">
        <h2>Create New Match</h2>
        <form th:action="@{/matches/create}" th:object="${newMatch}" method="post">
            <div class="form-group">
                <label for="homeTeam">Home Team:</label>
                <input type="text" id="homeTeam" th:field="*{homeTeam}" placeholder="e.g., Dubai American Academy" required />
            </div>
            
            <div class="form-group">
                <label for="awayTeam">Away Team:</label>
                <input type="text" id="awayTeam" th:field="*{awayTeam}" placeholder="e.g., American Community School Abu Dhabi" required />
            </div>

            <div class="form-group">
                <label for="homeScore">Home Score:</label>
                <input type="number" id="homeScore" th:field="*{homeScore}" value="0" />
            </div>

            <div class="form-group">
                <label for="awayScore">Away Score:</label>
                <input type="number" id="awayScore" th:field="*{awayScore}" value="0" />
            </div>

            <div class="form-group">
                <label for="status">Match Status:</label>
                <select id="status" th:field="*{status}">
                    <option value="UPCOMING">UPCOMING</option>
                    <option value="LIVE" selected>LIVE</option>
                    <option value="DONE">DONE</option>
                </select>
            </div>

            <button type="submit" class="btn">Create Match</button>
        </form>
    </div>

    <!-- Active Matches Table -->
    <div class="card">
        <h2>Current & Past Matches</h2>
        <table>
            <thead>
                <tr>
                    <th>Home Team</th>
                    <th>Score</th>
                    <th>Away Team</th>
                    <th>Status</th>
                </tr>
            </thead>
            <tbody>
                <tr th:if="${#lists.isEmpty(matches)}">
                    <td colspan="4" style="text-align: center; color: #718096;">No matches recorded yet.</td>
                </tr>
                <tr th:each="match : ${matches}">
                    <td th:text="${match.homeTeam}">Home Team</td>
                    <td style="font-weight: bold;">
                        <span th:text="${match.homeScore}">0</span> - <span th:text="${match.awayScore}">0</span>
                    </td>
                    <td th:text="${match.awayTeam}">Away Team</td>
                    <td>
                        <span th:class="${'badge ' + (match.status == 'LIVE' ? 'badge-live' : (match.status == 'DONE' ? 'badge-done' : 'badge-upcoming'))}" 
                              th:text="${match.status}">LIVE</span>
                    </td>
                </tr>
            </tbody>
        </table>
    </div>
</div>

</body>
</html>
