<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MESAC Live Results Tracker</title>
    <style>
        * { box-sizing: border-box; }
        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; margin: 0; padding: 30px; background-color: #f4f6f8; color: #333; }
        .container { max-width: 900px; margin: 0 auto; }
        h1 { margin-top: 0; color: #1a252f; }
        .card { background: white; padding: 24px; border-radius: 8px; margin-bottom: 24px; box-shadow: 0 2px 8px rgba(0,0,0,0.08); }
        .card h3 { margin-top: 0; margin-bottom: 16px; color: #2c3e50; }
        form.inline-form { display: flex; gap: 12px; flex-wrap: wrap; margin-bottom: 0; }
        input[type="text"], input[type="number"], select { padding: 10px 12px; font-size: 14px; border: 1px solid #ccc; border-radius: 4px; outline: none; }
        input[type="text"] { flex: 1; min-width: 150px; }
        button { background-color: #0066cc; color: white; border: none; padding: 10px 16px; font-size: 14px; border-radius: 4px; cursor: pointer; font-weight: 600; }
        button:hover { background-color: #0052a3; }
        table { width: 100%; border-collapse: collapse; margin-top: 10px; }
        th, td { border-bottom: 1px solid #eef2f5; padding: 12px 10px; text-align: left; vertical-align: middle; }
        th { background-color: #fafbfc; color: #5a6a75; font-size: 13px; text-transform: uppercase; letter-spacing: 0.5px; }
        .status-badge { padding: 4px 8px; border-radius: 4px; font-size: 12px; font-weight: bold; }
        .status-LIVE { background-color: #ffebe9; color: #cf222e; }
        .status-UPCOMING { background-color: #ddf4ff; color: #0969da; }
        .status-DONE { background-color: #dafbe1; color: #1a7f37; }
        .score-inputs { display: flex; gap: 6px; align-items: center; }
        .score-inputs input { width: 45px; text-align: center; }
    </style>
</head>
<body>

<div class="container">
    <h1>🏆 MESAC Tournament Tracker</h1>

    <!-- FORM 1: ADD NEW MATCH -->
    <div class="card">
        <h3>Add New Match</h3>
        <form class="inline-form" action="/api/matches/add" method="POST">
            <input type="text" name="homeTeam" placeholder="Home Team (e.g. Vipers)" required />
            <input type="text" name="awayTeam" placeholder="Away Team (e.g. Falcons)" required />
            <select name="status">
                <option value="UPCOMING">UPCOMING</option>
                <option value="LIVE">LIVE</option>
                <option value="DONE">DONE</option>
            </select>
            <button type="submit">Add Match</button>
        </form>
    </div>

    <!-- TABLE: DATABASE MATCHES -->
    <div class="card">
        <h3>Live & Upcoming Matches</h3>
        <table>
            <thead>
                <tr>
                    <th>ID</th>
                    <th>Matchup</th>
                    <th>Score</th>
                    <th>Status</th>
                    <th>Update Score</th>
                </tr>
            </thead>
            <tbody>
                <!-- Iterate through list of matches passed from MatchController -->
                <tr th:each="match : ${matches}">
                    <td th:text="${match.matchId}">m-101</td>
                    <td th:text="${match.homeTeam + ' vs ' + match.awayTeam}">Vipers vs Falcons</td>
                    <td th:text="${match.homeScore + ' - ' + match.awayScore}">0 - 0</td>
                    <td>
                        <span th:text="${match.status}" 
                              th:classappend="'status-' + ${match.status}" 
                              class="status-badge">UPCOMING</span>
                    </td>
                    <td>
                        <!-- FORM 2: QUICK SCORE UPDATE -->
                        <form action="/api/matches/score" method="POST" class="score-inputs">
                            <input type="hidden" name="matchId" th:value="${match.matchId}" />
                            <input type="number" name="homeScore" th:value="${match.homeScore}" min="0" required />
                            <span>:</span>
                            <input type="number" name="awayScore" th:value="${match.awayScore}" min="0" required />
                            <select name="status">
                                <option value="LIVE" th:selected="${match.status == 'LIVE'}">LIVE</option>
                                <option value="DONE" th:selected="${match.status == 'DONE'}">DONE</option>
                                <option value="UPCOMING" th:selected="${match.status == 'UPCOMING'}">UPCOMING</option>
                            </select>
                            <button type="submit">Save</button>
                        </form>
                    </td>
                </tr>
                <!-- Fallback message if no matches exist -->
                <tr th:if="${#lists.isEmpty(matches)}">
                    <td colspan="5" style="text-align: center; color: #888; padding: 20px;">No matches found in the database. Add one above!</td>
                </tr>
            </tbody>
        </table>
    </div>
</div>

</body>
</html>
