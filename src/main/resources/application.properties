spring.application.name=mesac-tracker
server.port=8080

# Local H2 File Database (creates ./data/mesacdb automatically)
spring.datasource.url=jdbc:h2:file:./data/mesacdb
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# H2 Console (http://localhost:8080/h2-console)
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# Automatically create/update database tables from @Entity classes
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true